name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov mypy interrogate build
        pip install https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.4/ml_ecosystem_snapshots-0.0.4-py3-none-any.whl
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt || true; fi
        if [ -f "requirements-test.txt" ]; then pip install -r requirements-test.txt || true; fi
        if [ -f "pyproject.toml" ]; then pip install -e . || true; fi

    - name: Check 3rd-party imports
      run: python scripts/check_deps.py

    - name: Check Typing and Docstring Lints
      run: python scripts/lint_typing_and_docs.py

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Static Types (Mypy)
      run: mypy src scripts tests

    - name: Check Docstring Coverage (Interrogate)
      run: interrogate -vv --fail-under=100 src scripts tests

    - name: Check API Compliance
      run: python scripts/check_compliance.py

    - name: Test & Coverage
      run: |
        pytest --cov=zero_optax --cov=scripts --cov-branch --cov-report=xml --cov-fail-under=100

    - name: Update Badges
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
