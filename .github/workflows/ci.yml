name: CI

on:
  push:
    branches: [ master ]


permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero-optax
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7
      with:
        path: zero-optax

    - name: Checkout zero-jax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-jax
        path: zero-jax

    - name: Checkout zero-chex
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-chex
        path: zero-chex

    - name: Checkout zero-flax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-flax
        path: zero-flax

    - name: Checkout zero-grain
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-grain
        path: zero-grain

    - name: Checkout zero-orbax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-orbax
        path: zero-orbax

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov mypy interrogate build colorama pydantic zstandard black libcst h5py pyyaml
        pip install "cdd @ git+https://github.com/offscale/cdd-python.git@master"
        pip install --ignore-requires-python --no-deps \
          "git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffelib" \
          "git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffecli" \
          "git+https://github.com/SamuelMarks/griffe.git@rest"
        pip install --no-deps \
          "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl" \
          "ml-switcheroo-compiler @ https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl" \
          "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        python -c "import pathlib, ml_switcheroo_compiler; (pathlib.Path(ml_switcheroo_compiler.__file__).parent / 'py.typed').touch()"
        pip install --no-deps -e ../zero-jax
        pip install --no-deps -e ../zero-chex
        pip install --no-deps -e ../zero-flax
        pip install --no-deps -e ../zero-orbax
        pip install --no-deps -e ../zero-grain
        pip install -r requirements-test.txt
        pip install --no-deps -e .
        mkdir -p ~/.cache/ml_ecosystem_snapshots/snapshots
        curl -fsSL "https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/optax_v0.2.8.json" -o ~/.cache/ml_ecosystem_snapshots/snapshots/optax_v0.2.8.json

    - name: Check 3rd-party imports
      run: python scripts/check_deps.py

    - name: Check Typing and Docstring Lints
      run: python scripts/lint_typing_and_docs.py

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Static Types (Mypy)
      run: mypy src scripts tests

    - name: Check Docstring Coverage (Interrogate)
      run: interrogate -vv --fail-under=100 src scripts tests

    - name: Check API Compliance
      run: python scripts/check_compliance.py

    - name: Test & Coverage
      run: |
        pytest --cov=zero_optax --cov=scripts --cov-branch --cov-report=xml --cov-report=json --cov-fail-under=100

    - name: Update Badges
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
