repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: lint-typing-and-docs
        name: Lint Typing and Docs
        entry: python3 scripts/lint_typing_and_docs.py
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Run Mypy
        entry: env MYPYPATH=src:../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src:../ml-ecosystem-snapshots/src:../zero-jax/src:../zero-chex/src:../zero-flax/src:../zero-orbax/src:../zero-grain/src mypy src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Check Docstring Coverage
        entry: interrogate -vv --fail-under=100 src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Run Pytest Coverage
        entry: env PYTHONPATH=src:../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src:../ml-ecosystem-snapshots/src:../zero-jax/src:../zero-chex/src:../zero-flax/src:../zero-orbax/src:../zero-grain/src pytest --cov=src/zero_optax --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update Coverage Shields
        entry: python3 scripts/update_badges.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-deps
        name: Check 3rd-party dependencies
        entry: python3 scripts/check_deps.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-api-compliance
        name: Check API Conformance
        entry: env PYTHONPATH=src:../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src:../ml-ecosystem-snapshots/src:../zero-jax/src:../zero-chex/src:../zero-flax/src:../zero-orbax/src:../zero-grain/src python3 scripts/check_compliance.py
        language: system
        files: ^(SEMANTIC_PLAN\.md|src/.*\.py)$
        pass_filenames: false

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
